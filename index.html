<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      viewport-fit=cover : env(safe-area-inset-*) を有効にするために必須
      （ノッチ / Dynamic Island / ホームインジケーターの安全領域を取得できるようになる）
      maximum-scale=1, user-scalable=no : ネイティブアプリらしく、ピンチズームでの
      レイアウト崩れを防ぐ（フォーム入力のダブルタップズームも抑制）
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>スロメモ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
