<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>スロメモ｜KJ Studio Labs</title>
<meta name="description" content="スロメモはパチスロ・パチンコの収支を簡単に記録・分析できる収支管理アプリです。" />
<style>
  :root {
    --ink: #0F172A;
    --blue: #2563EB;
    --white: #ffffff;
    --gray-100: #f8fafc;
    --gray-200: #e7eaf0;
    --gray-500: #8b93a1;
    --gray-600: #5b6472;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--white);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.75;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 24px; }

  header.site-header { padding: 28px 0; }
  header.site-header .wrap { display: flex; align-items: center; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none !important; }
  .brand-logo { height: 26px; width: auto; display: block; }
  .brand-logo svg { height: 100%; width: auto; display: block; }
  .brand-name { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: 0.01em; }

  main { padding: 40px 0 72px; }

  footer.site-footer { border-top: 1px solid var(--gray-200); padding: 32px 0 48px; margin-top: 48px; }
  footer.site-footer .wrap { display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
  .footer-links { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .footer-links a { color: var(--gray-600); font-size: 13px; }
  .footer-meta { color: var(--gray-500); font-size: 12px; line-height: 1.9; }

  .hero { text-align: center; padding: 32px 0 8px; }
  .hero .icon {
    width: 96px; height: 96px; border-radius: 21px;
    display: block; object-fit: cover; margin: 0 auto 28px;
    box-shadow: 0 6px 18px rgba(15,23,42,0.16);
  }
  .hero h1 { font-size: 30px; font-weight: 800; margin: 0 0 16px; letter-spacing: 0.02em; }
  .hero p.lead { font-size: 16px; color: var(--gray-600); max-width: 460px; margin: 0 auto 40px; }

  .link-cards { display: grid; gap: 12px; margin-top: 8px; }
  .link-card {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px; border: 1px solid var(--gray-200); border-radius: 14px;
    color: var(--ink) !important; text-decoration: none !important;
    font-weight: 600; font-size: 15px;
    transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .link-card:hover { border-color: var(--blue); background: var(--gray-100); box-shadow: 0 2px 10px rgba(15,23,42,0.06); }
  .link-card .chev { color: var(--gray-500); font-weight: 400; }

  @media (max-width: 480px) {
    header.site-header { padding: 22px 0; }
    main { padding: 28px 0 56px; }
    .hero h1 { font-size: 26px; }
  }
</style>
</head>
