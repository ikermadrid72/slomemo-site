<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>お問い合わせ｜スロメモ</title>
<meta name="description" content="スロメモへのお問い合わせ先です。" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root {
    --ink: #0F172A;
    --blue: #2563EB;
    --white: #ffffff;
    --gray-100: #f8fafc;
    --gray-200: #e7eaf0;
    --gray-500: #8b93a1;
    --gray-600: #5b6472;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--white);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.75;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 24px; }

  header.site-header { padding: 28px 0; }
  header.site-header .wrap { display: flex; align-items: center; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none !important; }
  .brand-logo { height: 26px; width: auto; display: block; }
  .brand-logo svg { height: 100%; width: auto; display: block; }
  .brand-name { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: 0.01em; }

  main { padding: 40px 0 72px; }

  footer.site-footer { border-top: 1px solid var(--gray-200); padding: 32px 0 48px; margin-top: 48px; }
  footer.site-footer .wrap { display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
  .footer-links { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .footer-links a { color: var(--gray-600); font-size: 13px; }
  .footer-meta { color: var(--gray-500); font-size: 12px; line-height: 1.9; }

  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--gray-600) !important; margin-bottom: 8px; }
  .contact-box { text-align: center; padding: 64px 0; }
  .contact-box h1 { font-size: 22px; font-weight: 800; margin: 0 0 26px; }
  .contact-box .email {
    display: inline-block; font-size: 18px; font-weight: 700; color: var(--blue);
    padding: 14px 26px; border: 1px solid var(--gray-200); border-radius: 14px;
    word-break: break-all;
  }

  @media (max-width: 480px) {
    header.site-header { padding: 22px 0; }
    .contact-box { padding: 44px 0; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="KJ Studio Labs トップページへ">
      <span class="brand-logo">
        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="72" y="72" width="880" height="880" rx="208" fill="#0F172A"/>
          <path d="M704 952 H744 C859 952 952 859 952 744 V704 Z" fill="#2563EB"/>
          <text x="512" y="635" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="470" letter-spacing="-36" fill="#FFFFFF">KJ</text>
        </svg>
      </span>
      <span class="brand-name">KJ Studio Labs</span>
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <a class="back-link" href="index.html">← トップに戻る</a>

    <section class="contact-box">
      <h1>お問い合わせ</h1>
      <a class="email" href="mailto:slomemo.support@gmail.com">slomemo.support@gmail.com</a>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-links">
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="terms.html">利用規約</a>
      <a href="contact.html">お問い合わせ</a>
    </div>
    <div class="footer-meta">
      <div>Developed by KJ Studio Labs</div>
      <div>© 2026 KJ Studio Labs</div>
    </div>
  </div>
</footer>

</body>
</html>
