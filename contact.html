<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>お問い合わせ｜スロメモ</title>
<meta name="description" content="スロメモへのお問い合わせ先です。" />
<style>
  :root {
    --black: #0b0b0d;
    --white: #ffffff;
    --blue: #0A5FFF;
    --gray-300: #e2e4e9;
    --gray-500: #8a8f98;
    --gray-700: #4b4f58;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--white);
    color: var(--black);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.75;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 20px; }

  header.site-header { border-bottom: 1px solid var(--gray-300); padding: 18px 0; }
  header.site-header .wrap { display: flex; align-items: center; gap: 10px; }
  .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; color: var(--black); }
  .logo svg { display: block; }

  main { padding: 40px 0 64px; }

  footer.site-footer { border-top: 1px solid var(--gray-300); padding: 28px 0 40px; margin-top: 40px; }
  footer.site-footer .wrap { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
  .footer-links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .footer-links a { color: var(--gray-700); font-size: 13px; }
  .copyright { color: var(--gray-500); font-size: 12px; }

  .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--gray-700) !important; margin-bottom: 8px; }

  .contact-box { text-align: center; padding: 64px 0; }
  .contact-box h1 { font-size: 22px; font-weight: 800; margin: 0 0 26px; }
  .contact-box .email {
    display: inline-block; font-size: 18px; font-weight: 700; color: var(--blue);
    padding: 14px 26px; border: 1px solid var(--gray-300); border-radius: 14px;
    word-break: break-all;
  }

  @media (max-width: 480px) {
    .contact-box { padding: 44px 0; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="14" width="4" height="7" rx="1" fill="#0A5FFF"/>
        <rect x="10" y="9" width="4" height="12" rx="1" fill="#0A5FFF"/>
        <rect x="17" y="4" width="4" height="17" rx="1" fill="#0A5FFF"/>
      </svg>
      スロメモ
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <a class="back-link" href="index.html">← トップに戻る</a>

    <section class="contact-box">
      <h1>お問い合わせ</h1>
      <a class="email" href="mailto:slomemo.support@gmail.com">slomemo.support@gmail.com</a>
    </section>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-links">
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="terms.html">利用規約</a>
      <a href="contact.html">お問い合わせ</a>
    </div>
    <div class="copyright">© 2026 スロメモ</div>
  </div>
</footer>

</body>
</html>
